<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>記事エディタ | FA現場ノート</title>
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="notion.css">
  <link rel="stylesheet" href="resize.css">
</head>
<body>
  <header class="topbar">
    <a href="../" class="brand">FA現場ノート <span>管理画面</span></a>
    <div class="topbar-actions"><span id="save-state">下書きはこの端末に保存されます</span><button class="secondary" id="new-post">新規記事</button></div>
  </header>

  <main class="editor-shell">
    <section class="editor-panel">
      <div class="title-row"><input id="title" type="text" placeholder="記事タイトル" aria-label="記事タイトル"><input id="date" type="date" aria-label="公開日"></div>
      <textarea id="excerpt" rows="2" placeholder="記事の要約（記事一覧に表示）"></textarea>
      <fieldset class="categories"><legend>カテゴリ</legend><label><input type="checkbox" value="PLC・産業用コントローラ"> PLC・産業用コントローラ</label><label><input type="checkbox" value="サーボ・モーション"> サーボ・モーション</label><label><input type="checkbox" value="インバータ・モータ"> インバータ・モータ</label><label><input type="checkbox" value="表示器・HMI"> 表示器・HMI</label><label><input type="checkbox" value="産業ネットワーク・通信"> 産業ネットワーク・通信</label><label><input type="checkbox" value="更新・置換"> 更新・置換</label><label><input type="checkbox" value="選定の考え方"> 選定の考え方</label><label><input type="checkbox" value="トラブル対応"> トラブル対応</label></fieldset>

      <div class="toolbar" aria-label="本文ツールバー">
        <button data-command="h2">見出し</button><button data-command="bold"><b>太字</b></button><button data-command="italic"><i>斜体</i></button><button data-command="ul">・リスト</button><button data-command="ol">1. リスト</button><button data-command="link">リンク</button><button data-command="code">コード</button><button data-command="mermaid">Mermaid</button><label class="image-button">画像を追加<input id="image-input" type="file" accept="image/png,image/jpeg,image/webp"></label>
      </div>
      <p class="editor-hint">本文で <kbd>/</kbd> を入力すると、ブロックの種類を選べます。</p>
      <div id="editor" class="content-editor" contenteditable="true" data-placeholder="ここに本文を書きます。ツールバーで見出し、コード、図、画像を追加できます。"></div>
      <div id="slash-menu" class="slash-menu" hidden></div>
    </section>

    <aside class="side-panel">
      <section class="card"><h2>プレビュー</h2><div id="preview" class="preview"></div></section>
      <section class="card export-card"><h2>出力・公開</h2><p>本文はMarkdownへ変換されます。画像はWebPに最適化して、記事と一緒にダウンロードできます。</p><button id="copy-md">Markdownをコピー</button><button id="download-md" class="secondary">Markdownを保存</button><button id="download-images" class="secondary">画像を保存</button><hr><p class="auth-note"><b>GitHubへの直接公開:</b> OAuth連携を設定すると、この画面から下書き・公開まで行えます。いまは安全のためローカル保存と書き出しのみ有効です。</p><button disabled title="GitHub OAuth連携の設定後に有効になります">GitHubへ公開（準備中）</button></section>
    </aside>
  </main>

  <dialog id="crop-dialog"><form method="dialog" class="crop-modal"><div class="modal-title"><h2>画像を調整</h2><button value="cancel" aria-label="閉じる">×</button></div><div class="crop-stage"><img id="crop-image" alt="トリミング対象"><div id="crop-frame"></div></div><div class="crop-controls"><label>比率 <select id="crop-ratio"><option value="1.7777778">16:9</option><option value="1.3333333">4:3</option><option value="1">1:1</option><option value="0">自由</option></select></label><label>拡大 <input id="crop-scale" type="range" min="1" max="3" step="0.01" value="1"></label><label>横位置 <input id="crop-x" type="range" min="0" max="100" value="50"></label><label>縦位置 <input id="crop-y" type="range" min="0" max="100" value="50"></label><label>代替テキスト <input id="image-alt" type="text" placeholder="画像の内容を説明"></label><label>キャプション <input id="image-caption" type="text" placeholder="任意"></label></div><div class="modal-actions"><button value="cancel" class="secondary">キャンセル</button><button id="insert-image" value="default">本文へ追加</button></div></form></dialog>
  <script src="editor.js"></script>
</body>
</html>
