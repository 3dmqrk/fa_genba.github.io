<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">FA現場ノート <span>β</span></a>
    <nav aria-label="メインメニュー">
      <a href="{{ '/#articles' | relative_url }}">記事</a>
      <a href="{{ '/#categories' | relative_url }}">カテゴリ</a>
      <a href="{{ '/about/' | relative_url }}">このサイトについて</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>
    <p>© FA現場ノート</p>
    <a href="{{ '/admin/' | relative_url }}">管理画面</a>
    <a href="{{ '/about/' | relative_url }}">免責事項</a>
  </footer>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12.0.0/dist/mermaid.esm.min.mjs';
    document.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
      const diagram = document.createElement('pre');
      diagram.className = 'mermaid';
      diagram.textContent = code.textContent;
      code.parentElement.replaceWith(diagram);
    });
    if (document.querySelector('.mermaid')) {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
      mermaid.run({ querySelector: '.mermaid' });
    }
  </script>
</body>
</html>
