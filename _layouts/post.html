---
layout: default
---
<article class="post-wrap">
  <p class="meta">{{ page.categories | join: ' / ' }} · {{ page.date | date: "%Y.%m.%d" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.image %}<img class="post-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">{% endif %}
  <div class="post-content">{{ content }}</div>
</article>
